<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<style>
:root{color-scheme:light dark;font:13px -apple-system,BlinkMacSystemFont,sans-serif;color:light-dark(#252529,#f1f1f3);background:light-dark(#fff,#28282d)}
*{box-sizing:border-box}body{margin:0;padding:22px}h1{font-size:18px;margin:0 0 5px}p,small{color:light-dark(#666670,#b5b5bf);line-height:1.6}
#files{margin:12px 0 18px;padding:10px;background:light-dark(#f2f4f8,#34343d);border-radius:8px;overflow-wrap:anywhere}
label{display:block;margin:16px 0 7px}input,select,button{font:inherit}select{display:block;width:100%;padding:7px;border:1px solid light-dark(#d4d4dd,#585863);border-radius:6px;background:light-dark(#fff,#34343d);color:inherit}input[type=range]{width:100%;accent-color:light-dark(#0871dc,#91bdff)}output{float:right}small{display:block;font-size:11px;margin-top:5px}
.remember{display:flex;align-items:center;gap:6px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}button{padding:7px 15px;border:1px solid light-dark(#d4d4dd,#585863);border-radius:6px;background:light-dark(#f4f4f6,#36363d);color:inherit;cursor:pointer}
#run{background:light-dark(#0871dc,#91bdff);color:light-dark(#fff,#142439);border:0}button:disabled{opacity:.5;cursor:default}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px ui-monospace,monospace;background:light-dark(#f2f4f8,#34343d);padding:12px;border-radius:7px}
</style></head><body>
<h1 id="title" data-i18n="title">Compress JPEG images</h1><small data-i18n="subtitle">JPEG images · Keep originals and create copies</small>
<div id="files"></div>
<label for="quality"><span data-i18n="quality">JPEG quality</span> <output id="qualityValue">80 / 100</output></label>
<input id="quality" type="range" min="10" max="100" value="80"><small data-i18n="qualityHint">Higher values retain more detail.</small>
<label for="size" data-i18n="size">Image size</label><select id="size"><option value="0" data-i18n="original">Keep original size</option><option value="1280" data-i18n="size1280">Longest edge up to 1280 px</option><option value="1920" selected data-i18n="size1920">Longest edge up to 1920 px</option><option value="2560" data-i18n="size2560">Longest edge up to 2560 px</option></select><small data-i18n="sizeHint">Keep proportions. Smaller images are not enlarged.</small>
<label for="output" data-i18n="output">Output location</label><select id="output"><option value="same" data-i18n="same">Next to the originals</option><option value="subfolder" data-i18n="subfolder">Compressed Images subfolder</option></select><small data-i18n="outputHint">Append “-compressed”; number existing filenames automatically.</small>
<label class="remember"><input type="checkbox" id="remember" checked><span data-i18n="remember">Use these options next time</span></label>
<pre id="result" hidden></pre>
<div class="actions"><button id="cancel" type="button" data-i18n="cancel">Cancel</button><button id="run" type="button" data-i18n="run">Compress images</button></div>
<script>
const bridge=window.menumate, ctx=bridge.context;
const zh=String(ctx.locale||'en').toLowerCase().startsWith('zh');
const messages={
 en:{title:'Compress JPEG images',subtitle:'JPEG images · Keep originals and create copies',quality:'JPEG quality',qualityHint:'Higher values retain more detail.',size:'Image size',original:'Keep original size',size1280:'Longest edge up to 1280 px',size1920:'Longest edge up to 1920 px',size2560:'Longest edge up to 2560 px',sizeHint:'Keep proportions. Smaller images are not enlarged.',output:'Output location',same:'Next to the originals',subfolder:'Compressed Images subfolder',outputHint:'Append “-compressed”; number existing filenames automatically.',remember:'Use these options next time',cancel:'Cancel',run:'Compress images',running:'Compressing…',done:'Done',success:'Compression complete',failed:'Execution failed'},
 zh:{title:'图片压缩',subtitle:'JPEG 图片 · 保留原图，生成副本',quality:'JPEG 质量',qualityHint:'数值越高，保留细节越多。',size:'图片尺寸',original:'保持原尺寸',size1280:'最长边不超过 1280 px',size1920:'最长边不超过 1920 px',size2560:'最长边不超过 2560 px',sizeHint:'保持比例，小图不放大。',output:'输出位置',same:'与原图同目录',subfolder:'原目录下的“压缩图片”文件夹',outputHint:'文件名追加“-压缩”，遇到重名自动编号。',remember:'下次沿用本次选项',cancel:'取消',run:'开始压缩',running:'正在压缩…',done:'完成',success:'压缩完成',failed:'执行失败'}
};
const t=zh?messages.zh:messages.en;
document.documentElement.lang=zh?'zh-Hans':'en';
document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t[el.dataset.i18n];});

const quality=document.getElementById('quality'), size=document.getElementById('size'), output=document.getElementById('output');
document.getElementById('files').textContent=(zh?ctx.files.length+' 张图片：':ctx.files.length+' image'+(ctx.files.length===1?'':'s')+': ')+ctx.files.map(f=>f.name).join(zh?'、':', ');
quality.value=ctx.parameters.quality||80; size.value=String(ctx.parameters.maxEdge??1920);output.value=ctx.parameters.output||'same';
function showQuality(){document.getElementById('qualityValue').textContent=quality.value+' / 100';}
showQuality();quality.addEventListener('input',showQuality);
document.getElementById('cancel').addEventListener('click',()=>bridge.cancel());
document.getElementById('run').addEventListener('click',()=>{
  document.getElementById('run').disabled=true;document.getElementById('cancel').disabled=true;
  document.getElementById('run').textContent=t.running;
  bridge.submit({quality:Number(quality.value),maxEdge:Number(size.value),output:output.value},document.getElementById('remember').checked);
});
window.addEventListener('menumate:result',event=>{
  const r=event.detail, result=document.getElementById('result');result.hidden=false;
  result.textContent=(r.exitCode===0&&!r.timedOut?t.success:t.failed)+'\n'+(r.stdout||r.stderr);
  document.getElementById('run').hidden=true;document.getElementById('cancel').disabled=false;document.getElementById('cancel').textContent=t.done;
});
</script></body></html>
